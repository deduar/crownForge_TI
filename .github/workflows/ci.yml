name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Same Postgres + role bootstrap as local (compose), so CI tests what we run.
      - run: docker compose up -d --wait db
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build the image and smoke-test the full stack: db -> migrate job -> api.
      - run: docker compose up -d --build --wait
      - run: curl -fsS http://localhost:3000/health
      - name: Logs on failure
        if: failure()
        run: docker compose logs
